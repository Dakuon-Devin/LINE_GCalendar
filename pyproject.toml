[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "line_gcalendar"
version = "0.1.0"
description = "Googleカレンダーの予定をLINE Messaging APIで通知するシステム"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Dakuon-Devin" },
]

dependencies = [
    "google-api-python-client==2.118.0",
    "google-auth-httplib2==0.1.1",
    "google-auth-oauthlib==1.1.0",
    "requests==2.31.0",
    "apscheduler==3.10.4",
    "python-dotenv==1.0.0",
    "pytz==2023.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.5.1",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
